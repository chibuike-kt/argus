openapi: 3.1.0
info:
  title: ARGUS API
  version: 0.1.0
  description: >
    REST API for ARGUS. Commands, account operations, historical queries and
    resource management are REST under /api/v1 (ADR-004). Live updates are
    delivered over WebSockets and are specified separately.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: Connectivity check for the versioned API surface.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /instruments:
    get:
      operationId: listInstruments
      summary: >
        List every registered instrument -- internal/instruments.Store.ListAllFiltered.
        Defaults to enabled rows only (web-wiring-polish brief, item 2):
        a disabled test/fixture row filling a capped page was hiding the
        real, enabled instruments. The enabled query parameter can widen
        or narrow that.
      parameters:
        - name: enabled
          in: query
          required: false
          description: >
            true (default): only enabled instruments. false: only
            disabled. all: every row regardless of enablement (the
            endpoint's own previous default, before this parameter
            existed). Any other value is a 400.
          schema:
            type: string
            enum: [true, false, all]
            default: "true"
        - name: after_id
          in: query
          required: false
          description: >
            Keyset cursor: return instruments with id strictly greater than
            this value, ordered by id. Omitted means the first page. This is
            a different ordering from calling this endpoint with no
            parameters at all pages through (by id, not by provider then
            native_symbol) -- intentional, see internal/instruments.Store's
            own ListAllFiltered/ListAll split.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned. Default 200, maximum 500 -- enforced in
            the query itself, matching GET /setups and
            GET /instruments/{id}/candles's own caps.
          schema:
            type: integer
            format: int32
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instruments/stats:
    get:
      operationId: listInstrumentStats
      summary: >
        Side-panel figures for up to 50 instruments (real-panel-data
        brief), every one computed on the server with exact scaled-
        integer arithmetic from stored current (non-superseded), closed
        1-minute candles (internal/marketdata.Store.Stats). Enabled
        instruments only: an unknown or disabled id is simply omitted
        from the response, never an error, so the response does not
        reveal which ids exist. A figure whose input candles do not all
        exist is null, never zero and never approximated from a nearby
        candle. Duplicate ids are returned once, in first-seen order.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: >
            Comma-separated instrument ids, at most 50 (e.g. ids=1,2,3).
            More than 50, none, or a non-integer is a 400.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstrumentStats"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instruments/{id}/candles:
    get:
      operationId: listInstrumentCandles
      summary: >
        Closed candles for one instrument in [from, to), at the requested
        interval (default 1m, so an existing caller that never sends this
        parameter is unaffected). 1m is served directly
        (internal/marketdata.Store.ListClosedInRangeLimited, the same read
        path cmd/argus-worker's own CandleSource uses); 5m/15m/1h/4h/1d are
        computed on read from the canonical 1-minute series
        (internal/marketdata.Aggregate/AggregateRange/WindowsInRange) --
        the browser never aggregates (live-chart-pipeline brief rule 4), so
        history and the live stream's own derived candles cannot disagree.
        A forming candle's own values can still change, so it is never
        included at any interval; a window with any missing or still-
        forming source minute is silently excluded, never guessed or
        partially filled. from/to are both optional at this schema level
        so order=desc can mean "the latest N, no range known or needed"
        (web-wiring-polish brief, item 1) for 1m; above 1m both from and to
        are required regardless of order (see the handler's own comment on
        why the open-ended "latest N" shortcut is not built for aggregated
        intervals). Which intervals this endpoint serves for a given
        instrument is read entirely from that instrument's own
        supported_intervals (owner approved 12 November 2026) -- an
        interval not in that list is a 400, never an asset-class guess.
        Calendar-aware (session-bounded) windows for forex are not built,
        which is exactly why a forex instrument's own row does not list
        anything above 1m today.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: interval
          in: query
          required: false
          description: >
            1m (default): the canonical series, served directly. 5m, 15m,
            1h, 4h, 1d: computed on read by server-side aggregation: never
            built client-side, so the live stream and REST history always
            agree. Any other value is a 400. Whether a given interval is
            served for this instrument is read from its own
            supported_intervals, not guessed from asset class -- an
            interval not in that list is a clear 400.
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d]
            default: 1m
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: >
            Maximum candles returned. Default 500, maximum 1000 -- a client
            cannot request the whole table in one call regardless of how
            wide [from, to) is, at any interval.
          schema:
            type: integer
            format: int32
            default: 500
            minimum: 1
            maximum: 1000
        - name: order
          in: query
          required: false
          description: >
            asc (default): oldest first, unchanged from before this
            parameter existed, at every interval -- from and to are both
            required. desc: newest first -- "the most recent N" without
            already knowing a [from, to) range narrow enough to contain
            them (web-wiring-followup brief, Part 4; extended to every
            interval, not just 1m, by adr-004-ws-contract-review.md's own
            addendum item C). limit still applies either way. desc with
            from/to both omitted is allowed at any interval: at 1m,
            enforced in SQL; above 1m, anchored at the per-interval join
            point (last_closed_open_time) and walked backward in the
            handler, over the aggregated windows.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleHistory"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instruments/{id}/structure:
    get:
      operationId: getInstrumentStructure
      summary: >
        The stored market structure of one instrument and timeframe over a
        time window, for the chart layers (Phase 6.2): confirmed swings,
        structure events (BOS, CHOCH, direction established) and liquidity
        sweeps, current rows only (a row superseded by a candle correction
        is never returned). Read only. Bounded: [from, to) at most 31 days,
        and at most limit rows of each kind, oldest first. When any kind
        reached its limit, every kind is cut at the same time and next_from
        says where the next page starts, so pages never overlap and never
        skip a row. Prices are decimal strings at the instrument's price
        scale. This is the stored structure, not a setup's evidence: a
        setup's own swings, sweep and break are in GET /setups/{id}/evidence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: timeframe
          in: query
          required: false
          description: The analysed timeframe. Only 1m is analysed today.
          schema:
            type: string
            default: 1m
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum rows of each kind. Default 500, minimum 10, maximum 2000.
          schema:
            type: integer
            format: int32
            default: 500
            minimum: 10
            maximum: 2000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureWindow"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /engine/status:
    get:
      operationId: getEngineStatus
      summary: >
        What the analysis engine has evaluated, from stored processing
        cursors only (Phase 6.5, D7): per enabled instrument, the close time
        of the last candle evaluated, when the worker last advanced it, the
        newest stored closed candle, and how far the evaluation is behind
        it. Nothing is estimated. A worker tick that found no new candle
        writes nothing, so last_evaluated_at is the last time a candle was
        evaluated, not the last time the worker woke up.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
  /activity:
    get:
      operationId: listActivity
      summary: >
        The activity feed, newest first, from stored rows only (Phase 6.5,
        D7): setup events (a setup created or changing state), structure
        events (BOS, CHOCH, direction established) and resolved ingestion
        gaps (recovered by backfill, or confirmed to have no data). Open
        gaps are not listed. Keyset paginated with an opaque cursor.
      parameters:
        - name: instrument_id
          in: query
          required: false
          description: Restrict to these instruments (up to 50). Omitted means every enabled instrument.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: integer
              format: int64
        - name: kind
          in: query
          required: false
          description: Which kinds to list. Omitted means all three.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [setup, structure, gap]
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page. Omitted for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum items. Default 50, maximum 200.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups:
    get:
      operationId: listSetups
      summary: >
        List current setups for an instrument (and, optionally, a timeframe) --
        internal/setups.Store.ListByInstrument. Read-only historical/resource
        query per ADR-004; live lifecycle transitions are a separate,
        still-open WebSocket piece, not this endpoint.
      parameters:
        - name: instrument_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: timeframe
          in: query
          required: false
          description: >
            Only "1m" is meaningful today (see
            cmd/argus-worker/processing.go's own comment on why), but this
            parameter is not hardcoded to it: a real seam for when a second
            timeframe becomes evaluable.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: >
            Restrict to one lifecycle state. Omitted means no filter --
            existing behavior, unchanged.
          schema:
            type: string
            enum: [detected, actionable, triggered, invalidated]
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned, most recently updated first (the store's
            own existing ordering, unchanged). Default 50, maximum 200.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
        - name: include_evidence
          in: query
          required: false
          description: >
            When true, each setup carries its recorded evidence chain
            (`evidence`, the same document GET /setups/{id}/evidence returns),
            so a chart can draw every setup's own evidence from one request
            (Phase 6). Bounded by limit. Default false.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setup"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}:
    get:
      operationId: getSetup
      summary: A single setup by its own id -- internal/setups.Store.GetByID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}/evidence:
    get:
      operationId: getSetupEvidence
      summary: >
        The evidence chain recorded with the setup's decision (Phase 6.1,
        D6): the ordered steps of the story -- the swept swing, the sweep,
        the protected swing, the break the order block was anchored to, the
        premium or discount of the active range, the structural liquidity,
        the QMR check, the zone and the plan -- each with its candle open
        times, prices (decimal strings at the instrument's scale), the spec
        section and its result. The newest recorded chain (the detected
        event's, or a later amendment's after a candle correction).
        recorded is false for every setup created before evidence was
        recorded; nothing is reconstructed for those.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupEvidence"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}/events:
    get:
      operationId: listSetupEvents
      summary: >
        A setup's full append-only history, in creation order --
        internal/setups.Store.ListEvents. The "Evidence" data a client needs
        to reconstruct how a setup got where it is (ADR-011).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupEvent"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/start:
    post:
      operationId: authSignupStart
      summary: >
        Starts or restarts a signup: sends a 6-digit emailed code
        (ADR-015 "Signup and onboarding"). Always 202 with the
        identical generic body and equal timing whether the email is
        new or already registered -- for an existing account this
        sends a notice instead of a code, and the notice itself is
        skipped silently (never a 429) if the per-email hourly limit
        is already spent; a new email within its own 60s resend
        cooldown gets the same silent 202 with nothing re-sent, so
        that limit can never disclose that the account exists either.
        429 is only ever the per-IP limit. Requires accepted_terms:
        true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupStartRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericAccepted"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/verify:
    post:
      operationId: authSignupVerify
      summary: >
        Checks a 6-digit code and, if correct, returns a single-use
        signup ticket valid for 30 minutes (ADR-015). One generic
        invalid_code for a wrong, expired, unknown or exhausted code --
        none of those is distinguished for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupVerifyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/complete:
    post:
      operationId: authSignupComplete
      summary: >
        Consumes a signup ticket and creates the account, already
        verified (ADR-015: "no half accounts") -- the first and only
        point a users row is created for this flow. terms_accepted_at/
        terms_version are copied from the signup start this ticket
        descends from. On success, sets the session cookie and returns
        the user, the same as login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCompleteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: authLogin
      summary: >
        Generic invalid_credentials for unknown email, wrong password
        or an unverified account alike (ADR-015). On success, sets the
        session cookie and returns the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revokes the current session and clears the cookie. Idempotent.
      responses:
        "204":
          description: No Content
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      summary: Revokes every session belonging to the authenticated user.
      responses:
        "204":
          description: No Content
  /auth/me:
    get:
      operationId: authMe
      summary: The authenticated user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /auth/sessions:
    get:
      operationId: authListSessions
      summary: The authenticated user's own active sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthSession"
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      summary: >
        Revokes one of the authenticated user's own sessions. A
        session id that exists but belongs to a different user is 404,
        not 403 (ADR-015: it must not even confirm that id is real).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/profile:
    put:
      operationId: updateProfile
      summary: Sets the authenticated user's display name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary: >
        Records onboarding_completed_at (ADR-015), but only once the
        authenticated user already has a display name and at least one
        watchlist item -- 409 onboarding_incomplete otherwise: the
        request itself is well formed, the account's current state is
        just not yet eligible.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/preferences:
    get:
      operationId: getPreferences
      summary: >
        The signed-in user's own preferences document (owner decision D1,
        brief-argus-product-overhaul.md Phase 1): every setting the user
        has made, stored server-side so it survives a cleared browser and
        a login on another device. A user with nothing stored yet gets an
        empty object at version 0. Ownership is the session user only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
    put:
      operationId: updatePreferences
      summary: >
        Replaces the whole preferences document. version must be the
        version the change was based on (0 for the first write); a stale
        version is a 409 so two tabs or devices never silently overwrite
        each other -- the client re-reads, re-applies its own changed keys
        and retries. The document is schema-validated: an unknown key at
        any level, a wrong type or an out-of-range value is a 400; a body
        above 64 KB is a 413.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict (stale version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/drawings:
    get:
      operationId: getDrawings
      summary: >
        The signed-in user's own drawings on one chart (instrument and
        timeframe). Nothing stored yet: an empty array at version 0. An
        unknown or disabled instrument is a 404.
      parameters:
        - $ref: "#/components/parameters/DrawingsInstrumentId"
        - $ref: "#/components/parameters/DrawingsTimeframe"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drawings"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateDrawings
      summary: >
        Replaces the drawings on one chart, with the same version rule as
        PUT /me/preferences (409 on a stale version). data is an array of
        drawing objects, each with a string id and kind (the rest is the
        web app's own drawing shape); at most 1000 drawings, and a body
        above 256 KB is a 413.
      parameters:
        - $ref: "#/components/parameters/DrawingsInstrumentId"
        - $ref: "#/components/parameters/DrawingsTimeframe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawingsUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drawings"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict (stale version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /watchlist:
    get:
      operationId: getWatchlist
      summary: The authenticated user's own watchlist, in order (ADR-016 -- watchlists are private).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    put:
      operationId: updateWatchlist
      summary: >
        Replaces the authenticated user's whole watchlist at once, in
        the given order (ADR-015: enabled instruments, maximum 50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /watchlist/items:
    post:
      operationId: addWatchlistItem
      summary: >
        Adds one instrument at the end of the authenticated user's own
        watchlist (D4; Phase 4.1a, D15). Idempotent: an instrument already
        on the list changes nothing and returns the list. Ownership comes
        only from the session. Limits: 50 items per user (ADR-015), and the
        system cap of distinct tracked Hyperliquid symbols (D15.3, 8) --
        an add that would track a new symbol beyond it is refused with
        tracked_cap_reached. Outside production only, adding a disabled
        Hyperliquid perpetual enables it, with an audit record (D15.1); in
        production a disabled instrument is refused with
        instrument_not_enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddRequest"
      responses:
        "200":
          description: OK, the whole list in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad Request (invalid id, or instrument_not_enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: watchlist_full (50 items) or tracked_cap_reached (the system cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /watchlist/order:
    put:
      operationId: reorderWatchlist
      summary: >
        Sets the order of the authenticated user's own watchlist (D4). The
        ids must be exactly the current list, each once; if another tab
        added or removed one meanwhile the request is refused with 409
        watchlist_changed and nothing changes, so a reorder never undoes
        a concurrent add or remove.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistUpdateRequest"
      responses:
        "200":
          description: OK, the whole list in its new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: watchlist_changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /watchlist/tracking:
    get:
      operationId: getWatchlistTracking
      summary: >
        How ARGUS is tracking the authenticated user's watchlist (Phase
        4.1a): each item's ingestion state as the worker last recorded it
        (waiting, loading_history, live, retrying, failed,
        needs_attention, stopped; absent before the worker has seen it),
        and the system cap of distinct tracked symbols with the ids
        tracked now, so a client can tell which adds the cap would refuse.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistTracking"
  /watchlist/items/{instrument_id}:
    delete:
      operationId: removeWatchlistItem
      summary: >
        Removes one instrument from the authenticated user's own
        watchlist (D4, product overhaul brief: item-level endpoints, so
        two tabs never clobber each other the way a whole-list PUT can).
        Idempotent: removing an instrument that is not on the list is not
        an error. Ownership comes only from the session. Returns the
        remaining list, in order.
      parameters:
        - name: instrument_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK, the remaining watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    DrawingsInstrumentId:
      name: instrument_id
      in: query
      required: true
      schema:
        type: integer
        format: int64
    DrawingsTimeframe:
      name: timeframe
      in: query
      required: true
      description: One of 1m, 5m, 15m, 1h, 4h, 1d (validated by the handler; anything else is a 400).
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    SignupStartRequest:
      type: object
      required: [email, accepted_terms]
      properties:
        email:
          type: string
          format: email
        accepted_terms:
          type: boolean
    SignupVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
    SignupVerifyResponse:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
    SignupCompleteRequest:
      type: object
      required: [ticket, password]
      properties:
        ticket:
          type: string
        password:
          type: string
    ProfileUpdateRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
    Preferences:
      type: object
      required: [data, version]
      properties:
        data:
          description: >
            The preferences document (see internal/preferences for the
            exact, validated shape). Sent and stored as the raw JSON object.
          type: object
          x-go-type: json.RawMessage
        version:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
          nullable: true
    PreferencesUpdate:
      type: object
      required: [data, version]
      properties:
        data:
          type: object
          x-go-type: json.RawMessage
        version:
          type: integer
          format: int32
          description: The version this change is based on; 0 for the first write.
    Drawings:
      type: object
      required: [instrument_id, timeframe, data, version]
      properties:
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        data:
          type: array
          items:
            type: object
          x-go-type: json.RawMessage
        version:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
          nullable: true
    DrawingsUpdate:
      type: object
      required: [data, version]
      properties:
        data:
          type: array
          items:
            type: object
          x-go-type: json.RawMessage
        version:
          type: integer
          format: int32
    WatchlistItem:
      type: object
      required: [instrument_id, position]
      properties:
        instrument_id:
          type: integer
          format: int64
        position:
          type: integer
          format: int32
    WatchlistUpdateRequest:
      type: object
      required: [instrument_ids]
      properties:
        instrument_ids:
          type: array
          description: Order in this array becomes each item's position.
          items:
            type: integer
            format: int64
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    # GenericAccepted is deliberately the same shape (and the same
    # literal value) regardless of what actually happened server-side
    # -- register/verify/resend's own ADR-015 requirement that the
    # response never discloses whether an email exists or is already
    # verified.
    GenericAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
    AuthUser:
      type: object
      required: [id, email, email_verified, created_at, onboarding_completed]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
          nullable: true
        onboarding_completed:
          type: boolean
    AuthSession:
      type: object
      required: [id, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        user_agent:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        current:
          type: boolean
    Instrument:
      type: object
      required:
        - id
        - provider
        - native_symbol
        - asset_class
        - price_scale
        - qty_scale
        - tick_size
        - supported_intervals
        - enabled
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        native_symbol:
          type: string
        asset_class:
          type: string
        base_asset:
          type: string
          nullable: true
        quote_asset:
          type: string
          nullable: true
        price_scale:
          type: integer
          format: int32
        qty_scale:
          type: integer
          format: int32
        # Decimal string, not a JSON number: tick_size is a quant.Price
        # scaled by price_scale, and a float would silently lose exactness
        # (guide 13) -- the same reason Candle's own OHLCV fields below are
        # strings, not numbers.
        tick_size:
          type: string
        supported_intervals:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    Candle:
      type: object
      required: [open_time, close_time, open, high, low, close, volume, is_closed, revision]
      properties:
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        # Decimal strings, built from the instrument's own price_scale
        # (open/high/low/close) and qty_scale (volume) -- never JSON
        # numbers, which cannot carry a quant.Price/quant.Qty's exact
        # scaled value without risking silent precision loss (guide 13).
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: string
        is_closed:
          type: boolean
        # At interval 1m, the real stored row's own revision
        # (ADR-011: a correction increments it via SupersedeCandle). At
        # interval > 1m, the derived-candle revision rule
        # (adr-004-ws-contract-review.md review item 4): 1 + the sum of
        # (revision - 1) over every 1-minute candle in this bar's own
        # window -- starts at 1, rises by exactly 1 for every
        # supersession inside the window, never a fixed value, so a
        # correction to one 1-minute candle can still invalidate a
        # client's already-applied 5m/15m/1h/4h/1d bar via the client's
        # own "ignore anything not newer" guard.
        revision:
          type: integer
          format: int32
    CandleHistory:
      type: object
      required: [candles]
      description: >
        GET /instruments/{id}/candles' own response shape (live-chart-
        pipeline brief, Phase 1, corrected by adr-004-ws-contract-review.md
        review items 4 and 5): the candle array plus the join point with
        the live WebSocket stream (adr-004-ws-contract-draft.md's own
        `snapshot` message uses the same last_closed_open_time/
        last_closed_revision field names) -- the latest COMPLETE window of
        the requested interval (not always the latest closed 1-minute
        candle: a 1h request's own join point is its latest complete hour),
        independent of this response's own from/to range, so a client that
        paged backward through history still gets the real current join
        point, not whatever the requested range happened to end at.
        last_closed_revision follows the same derived-revision rule as
        every candle in this response at interval > 1m (see Candle's own
        revision field doc below): 1 + the sum of (revision - 1) over
        every source 1-minute candle in that window. Both last_closed_*
        fields are null only when no complete window of the requested
        interval exists yet.
      properties:
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        last_closed_open_time:
          type: string
          format: date-time
          nullable: true
        last_closed_revision:
          type: integer
          format: int32
          nullable: true
    InstrumentStats:
      type: object
      description: >
        One instrument's side-panel figures. Prices (last_price,
        last_close, change_24h) are decimal strings at the instrument's own
        price_scale; volume_24h is a decimal string at its qty_scale;
        percentages (change_24h_pct, performance.*) are decimal strings
        in percent units (no "%" sign), exactly 2 decimal places, rounded
        half-even, e.g. "-1.24". Every figure is null when the candles it
        needs do not all exist -- never zero, never interpolated.
      # Every nullable field is always sent (x-omitempty: false), as
      # an explicit null when absent -- a client never has to tell
      # "missing key" apart from "absent value".
      required: [instrument_id, performance]
      properties:
        instrument_id:
          type: integer
          format: int64
        last_close:
          type: string
          nullable: true
          x-omitempty: false
          description: >
            Close of the latest current, closed 1-minute candle: the
            performance anchor, not the live price (see last_price).
            Null when there is none yet.
        last_closed_open_time:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            Open time of that candle (UTC). Its own end -- data finalized
            through -- is this plus one minute.
        last_price:
          type: string
          nullable: true
          x-omitempty: false
          description: >
            The live price (D3, product overhaul brief): the close of the
            newest current 1-minute candle -- the forming candle's latest
            close, or, when nothing is forming, the latest closed
            candle's close (last_price_closed says which). The same
            figure, computed the same way, as the `stats` WebSocket
            message's last_price. Null when no candle is stored at all.
        last_price_closed:
          type: boolean
          nullable: true
          x-omitempty: false
          description: >
            True when last_price is a closed candle's close (no forming
            candle is newer), false when it is the forming candle's. Null
            with last_price.
        as_of:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            Exchange event time last_price belongs to: the open time of
            the candle it is the close of (UTC). Minute-grained: the
            provider's candle feed carries no per-trade timestamp.
        last_tick_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            When ARGUS last stored a value for that candle (its ingestion
            time, UTC) -- the basis for "no new ticks for N seconds". Not
            an exchange time.
        change_24h:
          type: string
          nullable: true
          x-omitempty: false
          description: >
            last_price minus the close of the current, closed 1-minute
            candle at change_24h_reference_open_time: as_of - 24h - 1
            minute when last_price is a forming candle's (the price at
            exactly 24h before the current minute began), as_of - 24h
            when it is a closed candle's. Null when that exact candle
            does not exist (history shorter than 24h, or that minute
            missing).
        change_24h_pct:
          type: string
          nullable: true
          x-omitempty: false
          description: change_24h divided by the reference close, in percent. Null when change_24h is null or the reference close is zero.
        change_24h_reference_open_time:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            The exact minute change_24h is measured against, whether or
            not a candle exists there -- so a null change_24h can say
            which minute is missing. Null with last_price.
        volume_24h:
          type: string
          nullable: true
          x-omitempty: false
          description: >
            Sum of base asset volume over the 1440 current 1-minute
            candles ending at (and including) the candle last_price
            comes from (the forming candle counts; any other candle must
            be closed). Null unless all 1440 exist.
        volume_24h_minutes:
          type: integer
          format: int64
          nullable: true
          x-omitempty: false
          description: >
            How many of those 1440 minutes are stored, so a null
            volume_24h can say why. Null with last_price.
        performance:
          $ref: "#/components/schemas/InstrumentPerformance"
    InstrumentPerformance:
      type: object
      description: >
        Percent change of last_close against the current, closed
        1-minute candle exactly this far before last_closed_open_time
        (1D = 24h, 1W = 7 days, 1M = 30 days, 3M = 90 days, 6M = 180
        days, 1Y = 365 days -- fixed durations, not calendar months).
        Null when that exact candle does not exist.
      properties:
        "1D":
          type: string
          nullable: true
          x-omitempty: false
        "1W":
          type: string
          nullable: true
          x-omitempty: false
        "1M":
          type: string
          nullable: true
          x-omitempty: false
        "3M":
          type: string
          nullable: true
          x-omitempty: false
        "6M":
          type: string
          nullable: true
          x-omitempty: false
        "1Y":
          type: string
          nullable: true
          x-omitempty: false
    # PlanSnapshot (internal/setups/types.go) is stored as JSONB but its
    # Go shape is stable (TargetSnapshot/POISnapshot/PlanSnapshot structs,
    # not a map), so it is typed here rather than left as a free-form
    # object -- the web-wiring-followup brief's own choice, made after
    # reading types.go. entry/stop/targets[].level/poi.low/poi.high are
    # decimal strings built from the setup's own instrument price_scale
    # (quant.Price.String(scale), internal/httpapi/setups.go's own
    # toAPIPlanSnapshot), matching every other money field this API sends
    # -- a breaking change from the bare scaled integers these fields sent
    # before (web-wiring-followup brief, Part 3); rr stays an exact
    # rational string (big.Rat.RatString()), unchanged.
    TargetSnapshot:
      type: object
      required: [level, rr]
      properties:
        level:
          type: string
        rr:
          type: string
    POISnapshot:
      type: object
      required:
        - type
        - direction
        - low
        - high
        - order_block_candle_id
        - order_block_candle_revision
        - order_block_open_time
        - qmr_fail_candle_id
        - qmr_fail_candle_revision
        - structural_swing_id
        - in_discount
      properties:
        type:
          type: string
        direction:
          type: string
        low:
          type: string
        high:
          type: string
        order_block_candle_id:
          type: integer
          format: int64
        order_block_candle_revision:
          type: integer
          format: int32
        order_block_open_time:
          type: string
          format: date-time
        qmr_fail_candle_id:
          type: integer
          format: int64
        qmr_fail_candle_revision:
          type: integer
          format: int32
        structural_swing_id:
          type: integer
          format: int64
        in_discount:
          type: boolean
    PlanSnapshot:
      type: object
      required: [status, direction, entry, stop, targets, poi, protected_swing_id]
      properties:
        status:
          type: string
        direction:
          type: string
        entry:
          type: string
        stop:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetSnapshot"
        poi:
          $ref: "#/components/schemas/POISnapshot"
        protected_swing_id:
          type: integer
          format: int64
    Setup:
      type: object
      required:
        - id
        - instrument_id
        - timeframe
        - poi_type
        - poi_source_candle_id
        - direction
        - strategy_version
        - state
        - poi_source_candle_revision
        - plan_snapshot
        - evaluation_time
        - algorithm_version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        poi_type:
          type: string
        poi_source_candle_id:
          type: integer
          format: int64
        direction:
          type: string
        strategy_version:
          type: string
        state:
          type: string
          enum: [detected, actionable, triggered, invalidated]
        poi_source_candle_revision:
          type: integer
          format: int32
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        last_event_id:
          type: integer
          format: int64
          nullable: true
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        found_mode:
          type: string
          enum: [live, replay, unknown]
          description: >
            How the setup was found: live (the candle that created it was the
            newest closed candle when the worker processed it), replay (the
            worker was catching up on older candles), or unknown (created
            before this was recorded). Set once, at creation.
        evidence_recorded:
          type: boolean
          description: Whether an evidence chain was recorded for this setup (false for every setup created before it was).
        detected_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Evaluation time of the setup's detected event.
        triggered_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            Evaluation time of its triggered event (spec section 14: a candle
            after the zone formed reached the entry). Null when it never
            triggered. The setup continues after it.
        invalidated_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: >
            Evaluation time of its invalidated event (a candle closed through
            the stop). Null while it is still active. A setup's zone ends here,
            or at the last candle while still active.
        evidence:
          allOf:
            - $ref: "#/components/schemas/SetupEvidence"
          nullable: true
          description: Only with include_evidence=true on GET /setups.
    SetupEvidence:
      type: object
      required: [setup_id, recorded]
      properties:
        setup_id:
          type: integer
          format: int64
        recorded:
          type: boolean
          description: False for a setup created before evidence was recorded ("evidence not recorded for this setup").
        event_type:
          type: string
          description: The event that recorded it (detected, or amendment).
        evaluation_time:
          type: string
          format: date-time
        schema:
          type: integer
          format: int32
        timeframe:
          type: string
        direction:
          type: string
        strategy_version:
          type: string
        algorithm_version:
          type: string
        as_of:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceStep"
    EvidenceStep:
      type: object
      required: [kind, section, result]
      properties:
        kind:
          type: string
          enum: [swing, sweep, break, premium_discount, structural_liquidity, qmr, poi, plan]
        role:
          type: string
          description: Tells two steps of the same kind apart (swept, protected).
        section:
          type: string
          description: The strategy spec section the step comes from.
        result:
          type: string
          enum: [met, not_met, unevaluable]
        reason:
          type: string
          description: A code for a not_met or unevaluable result.
        candles:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceCandle"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceLevel"
        attrs:
          type: object
          additionalProperties:
            type: string
    EvidenceCandle:
      type: object
      required: [role]
      properties:
        role:
          type: string
        open_time:
          type: string
          format: date-time
          nullable: true
        candle_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int32
    EvidenceLevel:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        price:
          type: string
          description: Decimal string at the instrument's price scale.
        swing_id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
          nullable: true
          description: When the level was set (a swing's pivot candle open time).
    SetupEvent:
      type: object
      required:
        - id
        - setup_id
        - event_type
        - plan_snapshot
        - poi_source_candle_id
        - poi_source_candle_revision
        - evaluation_time
        - algorithm_version
        - created_at
      properties:
        id:
          type: integer
          format: int64
        setup_id:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [detected, actionable, triggered, invalidated, amendment]
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        poi_source_candle_id:
          type: integer
          format: int64
        poi_source_candle_revision:
          type: integer
          format: int32
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
    StructureWindow:
      type: object
      required: [instrument_id, timeframe, from, to, swings, breaks, sweeps]
      properties:
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: The end of what this page covers (exclusive). Equal to next_from when the page was cut.
        swings:
          type: array
          items:
            $ref: "#/components/schemas/StructureSwing"
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/StructureBreak"
        sweeps:
          type: array
          items:
            $ref: "#/components/schemas/StructureSweep"
        next_from:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Where the next page starts when a kind reached its limit; null when the whole window was returned.
    StructureSwing:
      type: object
      required: [id, swing_type, pivot_time, price, confirmed_at]
      properties:
        id:
          type: integer
          format: int64
        swing_type:
          type: string
          enum: [high, low]
        pivot_time:
          type: string
          format: date-time
          description: The pivot candle's open time.
        price:
          type: string
        confirmed_at:
          type: string
          format: date-time
          description: Close time of the candle that confirmed it.
    StructureBreak:
      type: object
      required: [id, event_type, direction_before, direction_after, trigger_open_time, sweep_validated]
      properties:
        id:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [direction_established, bos, choch]
        direction_before:
          type: string
        direction_after:
          type: string
        trigger_open_time:
          type: string
          format: date-time
          description: Open time of the candle that broke structure.
        sweep_validated:
          type: boolean
        sweep_id:
          type: integer
          format: int64
          nullable: true
        protected_swing_id:
          type: integer
          format: int64
          nullable: true
        broken_swing:
          allOf:
            - $ref: "#/components/schemas/StructureLevel"
          nullable: true
          description: The swing a BOS or CHOCH broke; null for direction_established.
    StructureSweep:
      type: object
      required: [id, side, trigger_open_time, penetration_extreme, reclaim_close, swept_swing]
      properties:
        id:
          type: integer
          format: int64
        side:
          type: string
          enum: [buy, sell]
        trigger_open_time:
          type: string
          format: date-time
        penetration_extreme:
          type: string
        reclaim_close:
          type: string
        swept_swing:
          $ref: "#/components/schemas/StructureLevel"
    StructureLevel:
      type: object
      required: [swing_id, price, time]
      properties:
        swing_id:
          type: integer
          format: int64
        price:
          type: string
        time:
          type: string
          format: date-time
    EngineStatus:
      type: object
      required: [as_of, instruments]
      properties:
        as_of:
          type: string
          format: date-time
          description: Server time when this was read.
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/EngineInstrumentStatus"
    EngineInstrumentStatus:
      type: object
      required: [instrument_id, native_symbol, provider, analysed, closed_candles_behind]
      properties:
        instrument_id:
          type: integer
          format: int64
        native_symbol:
          type: string
        provider:
          type: string
        analysed:
          type: boolean
          description: False when the worker has never evaluated this instrument.
        timeframe:
          type: string
          nullable: true
        evaluated_through:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Close time of the last candle the engine evaluated.
        last_evaluated_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: When the worker last advanced the cursor (processing time).
        latest_closed_close_time:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Close time of the newest stored closed 1-minute candle.
        behind_seconds:
          type: integer
          format: int64
          nullable: true
          x-omitempty: false
          description: latest_closed_close_time minus evaluated_through, in seconds (0 when caught up). Null when either is absent.
        closed_candles_behind:
          type: integer
          format: int64
          description: Stored closed candles not yet evaluated.
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        next_cursor:
          type: string
          nullable: true
          x-omitempty: false
          description: Pass as cursor for the next page; null on the last page.
    ActivityItem:
      type: object
      required: [kind, id, instrument_id, timeframe, at, event_time, detail]
      properties:
        kind:
          type: string
          enum: [setup, structure, gap]
        id:
          type: integer
          format: int64
          description: The row id within its kind (setup event, structure event, gap).
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        at:
          type: string
          format: date-time
          description: When ARGUS recorded it (a gap's resolution time).
        event_time:
          type: string
          format: date-time
          description: The candle time it is about (a gap's start).
        detail:
          type: string
          description: >
            setup: the event type (detected, actionable, triggered,
            invalidated, amendment). structure: bos, choch or
            direction_established. gap: how it was resolved (for example
            backfilled).
        setup_id:
          type: integer
          format: int64
          nullable: true
        direction:
          type: string
          nullable: true
        poi_type:
          type: string
          nullable: true
        found_mode:
          type: string
          nullable: true
          description: live, replay or unknown (the setup's found_mode).
        gap_end:
          type: string
          format: date-time
          nullable: true
    WatchlistAddRequest:
      type: object
      required: [instrument_id]
      properties:
        instrument_id:
          type: integer
          format: int64
    WatchlistTracking:
      type: object
      required: [cap, tracked_instrument_ids, items, can_enable]
      properties:
        can_enable:
          type: boolean
          description: "Whether adding a disabled Hyperliquid perpetual enables it here (D15.1, never in production)."
        cap:
          type: integer
          format: int32
          description: The system cap of distinct tracked Hyperliquid symbols (D15.3).
        tracked_instrument_ids:
          type: array
          description: The instruments tracked now, in cap order (the configured floor first).
          items:
            type: integer
            format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItemTracking"
    WatchlistItemTracking:
      type: object
      required: [instrument_id, tracked]
      properties:
        instrument_id:
          type: integer
          format: int64
        tracked:
          type: boolean
          description: Within the cap and being ingested (or about to be).
        state:
          type: string
          nullable: true
          description: waiting, loading_history, live, retrying, failed, needs_attention or stopped; null before the worker has recorded one.
        reason:
          type: string
          nullable: true
        attempt:
          type: integer
          format: int32
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
