openapi: 3.1.0
info:
  title: ARGUS API
  version: 0.1.0
  description: >
    REST API for ARGUS. Commands, account operations, historical queries and
    resource management are REST under /api/v1 (ADR-004). Live updates are
    delivered over WebSockets and are specified separately.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: Connectivity check for the versioned API surface.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /instruments:
    get:
      operationId: listInstruments
      summary: >
        List every registered instrument -- internal/instruments.Store.ListAllFiltered.
        Includes disabled rows: nothing in that package can set enabled =
        TRUE yet (ADR-007), so filtering them out here would just hide every
        row behind a flag no client can act on.
      parameters:
        - name: after_id
          in: query
          required: false
          description: >
            Keyset cursor: return instruments with id strictly greater than
            this value, ordered by id. Omitted means the first page. This is
            a different ordering from calling this endpoint with no
            parameters at all pages through (by id, not by provider then
            native_symbol) -- intentional, see internal/instruments.Store's
            own ListAllFiltered/ListAll split.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned. Default 200, maximum 500 -- enforced in
            the query itself, matching GET /setups and
            GET /instruments/{id}/candles's own caps.
          schema:
            type: integer
            format: int32
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instruments/{id}/candles:
    get:
      operationId: listInstrumentCandles
      summary: >
        Closed 1-minute candles for one instrument in [from, to), oldest
        first -- internal/marketdata.Store.ListClosedInRangeLimited, the
        same read path cmd/argus-worker's own CandleSource uses. A forming
        candle's own values can still change, so it is never included.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: >
            Maximum candles returned. Default 500, maximum 1000 -- a client
            cannot request the whole table in one call regardless of how
            wide [from, to) is.
          schema:
            type: integer
            format: int32
            default: 500
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups:
    get:
      operationId: listSetups
      summary: >
        List current setups for an instrument (and, optionally, a timeframe) --
        internal/setups.Store.ListByInstrument. Read-only historical/resource
        query per ADR-004; live lifecycle transitions are a separate,
        still-open WebSocket piece, not this endpoint.
      parameters:
        - name: instrument_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: timeframe
          in: query
          required: false
          description: >
            Only "1m" is meaningful today (see
            cmd/argus-worker/processing.go's own comment on why), but this
            parameter is not hardcoded to it: a real seam for when a second
            timeframe becomes evaluable.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: >
            Restrict to one lifecycle state. Omitted means no filter --
            existing behavior, unchanged.
          schema:
            type: string
            enum: [detected, actionable, triggered, invalidated]
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned, most recently updated first (the store's
            own existing ordering, unchanged). Default 50, maximum 200.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setup"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}:
    get:
      operationId: getSetup
      summary: A single setup by its own id -- internal/setups.Store.GetByID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}/events:
    get:
      operationId: listSetupEvents
      summary: >
        A setup's full append-only history, in creation order --
        internal/setups.Store.ListEvents. The "Evidence" data a client needs
        to reconstruct how a setup got where it is (ADR-011).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupEvent"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    Instrument:
      type: object
      required:
        - id
        - provider
        - native_symbol
        - asset_class
        - price_scale
        - qty_scale
        - tick_size
        - supported_intervals
        - enabled
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        native_symbol:
          type: string
        asset_class:
          type: string
        base_asset:
          type: string
          nullable: true
        quote_asset:
          type: string
          nullable: true
        price_scale:
          type: integer
          format: int32
        qty_scale:
          type: integer
          format: int32
        # Decimal string, not a JSON number: tick_size is a quant.Price
        # scaled by price_scale, and a float would silently lose exactness
        # (guide 13) -- the same reason Candle's own OHLCV fields below are
        # strings, not numbers.
        tick_size:
          type: string
        supported_intervals:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    Candle:
      type: object
      required: [open_time, close_time, open, high, low, close, volume, is_closed, revision]
      properties:
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        # Decimal strings, built from the instrument's own price_scale
        # (open/high/low/close) and qty_scale (volume) -- never JSON
        # numbers, which cannot carry a quant.Price/quant.Qty's exact
        # scaled value without risking silent precision loss (guide 13).
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: string
        is_closed:
          type: boolean
        revision:
          type: integer
          format: int32
    # PlanSnapshot (internal/setups/types.go) is intentionally
    # variable-shape -- targets are a variable-length list of (level, RR)
    # pairs, stored as JSONB -- so it is deliberately left loosely typed
    # here rather than over-modeled into a schema that would drift from
    # the Go type on every change to it.
    PlanSnapshot:
      type: object
      additionalProperties: true
    Setup:
      type: object
      required:
        - id
        - instrument_id
        - timeframe
        - poi_type
        - poi_source_candle_id
        - direction
        - strategy_version
        - state
        - poi_source_candle_revision
        - plan_snapshot
        - evaluation_time
        - algorithm_version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        poi_type:
          type: string
        poi_source_candle_id:
          type: integer
          format: int64
        direction:
          type: string
        strategy_version:
          type: string
        state:
          type: string
          enum: [detected, actionable, triggered, invalidated]
        poi_source_candle_revision:
          type: integer
          format: int32
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        last_event_id:
          type: integer
          format: int64
          nullable: true
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SetupEvent:
      type: object
      required:
        - id
        - setup_id
        - event_type
        - plan_snapshot
        - poi_source_candle_id
        - poi_source_candle_revision
        - evaluation_time
        - algorithm_version
        - created_at
      properties:
        id:
          type: integer
          format: int64
        setup_id:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [detected, actionable, triggered, invalidated, amendment]
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        poi_source_candle_id:
          type: integer
          format: int64
        poi_source_candle_revision:
          type: integer
          format: int32
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
