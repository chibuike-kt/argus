openapi: 3.1.0
info:
  title: ARGUS API
  version: 0.1.0
  description: >
    REST API for ARGUS. Commands, account operations, historical queries and
    resource management are REST under /api/v1 (ADR-004). Live updates are
    delivered over WebSockets and are specified separately.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: Connectivity check for the versioned API surface.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /instruments:
    get:
      operationId: listInstruments
      summary: >
        List every registered instrument -- internal/instruments.Store.ListAllFiltered.
        Defaults to enabled rows only (web-wiring-polish brief, item 2):
        a disabled test/fixture row filling a capped page was hiding the
        real, enabled instruments. The enabled query parameter can widen
        or narrow that.
      parameters:
        - name: enabled
          in: query
          required: false
          description: >
            true (default): only enabled instruments. false: only
            disabled. all: every row regardless of enablement (the
            endpoint's own previous default, before this parameter
            existed). Any other value is a 400.
          schema:
            type: string
            enum: [true, false, all]
            default: "true"
        - name: after_id
          in: query
          required: false
          description: >
            Keyset cursor: return instruments with id strictly greater than
            this value, ordered by id. Omitted means the first page. This is
            a different ordering from calling this endpoint with no
            parameters at all pages through (by id, not by provider then
            native_symbol) -- intentional, see internal/instruments.Store's
            own ListAllFiltered/ListAll split.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned. Default 200, maximum 500 -- enforced in
            the query itself, matching GET /setups and
            GET /instruments/{id}/candles's own caps.
          schema:
            type: integer
            format: int32
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instruments/{id}/candles:
    get:
      operationId: listInstrumentCandles
      summary: >
        Closed 1-minute candles for one instrument in [from, to), oldest
        first -- internal/marketdata.Store.ListClosedInRangeLimited, the
        same read path cmd/argus-worker's own CandleSource uses. A forming
        candle's own values can still change, so it is never included.
        from/to are both optional at this schema level so order=desc can
        mean "the latest N, no range known or needed" (web-wiring-polish
        brief, item 1); the handler itself still requires both, with the
        same message as before, when order is asc or omitted -- see its
        own comment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: >
            Maximum candles returned. Default 500, maximum 1000 -- a client
            cannot request the whole table in one call regardless of how
            wide [from, to) is.
          schema:
            type: integer
            format: int32
            default: 500
            minimum: 1
            maximum: 1000
        - name: order
          in: query
          required: false
          description: >
            asc (default): oldest first, unchanged from before this
            parameter existed. desc: newest first -- "the most recent N"
            without already knowing a [from, to) range narrow enough to
            contain them (web-wiring-followup brief, Part 4). limit still
            applies either way, enforced in SQL.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups:
    get:
      operationId: listSetups
      summary: >
        List current setups for an instrument (and, optionally, a timeframe) --
        internal/setups.Store.ListByInstrument. Read-only historical/resource
        query per ADR-004; live lifecycle transitions are a separate,
        still-open WebSocket piece, not this endpoint.
      parameters:
        - name: instrument_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: timeframe
          in: query
          required: false
          description: >
            Only "1m" is meaningful today (see
            cmd/argus-worker/processing.go's own comment on why), but this
            parameter is not hardcoded to it: a real seam for when a second
            timeframe becomes evaluable.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: >
            Restrict to one lifecycle state. Omitted means no filter --
            existing behavior, unchanged.
          schema:
            type: string
            enum: [detected, actionable, triggered, invalidated]
        - name: limit
          in: query
          required: false
          description: >
            Maximum rows returned, most recently updated first (the store's
            own existing ordering, unchanged). Default 50, maximum 200.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setup"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}:
    get:
      operationId: getSetup
      summary: A single setup by its own id -- internal/setups.Store.GetByID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setups/{id}/events:
    get:
      operationId: listSetupEvents
      summary: >
        A setup's full append-only history, in creation order --
        internal/setups.Store.ListEvents. The "Evidence" data a client needs
        to reconstruct how a setup got where it is (ADR-011).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupEvent"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/start:
    post:
      operationId: authSignupStart
      summary: >
        Starts or restarts a signup: sends a 6-digit emailed code
        (ADR-015 "Signup and onboarding"). Always 202 with the
        identical generic body and equal timing whether the email is
        new or already registered -- for an existing account this
        sends a notice instead of a code, and the notice itself is
        skipped silently (never a 429) if the per-account hourly limit
        is already spent, so that limit can never disclose that the
        account exists either. Requires accepted_terms: true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupStartRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericAccepted"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/verify:
    post:
      operationId: authSignupVerify
      summary: >
        Checks a 6-digit code and, if correct, returns a single-use
        signup ticket valid for 30 minutes (ADR-015). One generic
        invalid_code for a wrong, expired, unknown or exhausted code --
        none of those is distinguished for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupVerifyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup/complete:
    post:
      operationId: authSignupComplete
      summary: >
        Consumes a signup ticket and creates the account, already
        verified (ADR-015: "no half accounts") -- the first and only
        point a users row is created for this flow. terms_accepted_at/
        terms_version are copied from the signup start this ticket
        descends from. On success, sets the session cookie and returns
        the user, the same as login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCompleteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: authLogin
      summary: >
        Generic invalid_credentials for unknown email, wrong password
        or an unverified account alike (ADR-015). On success, sets the
        session cookie and returns the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revokes the current session and clears the cookie. Idempotent.
      responses:
        "204":
          description: No Content
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      summary: Revokes every session belonging to the authenticated user.
      responses:
        "204":
          description: No Content
  /auth/me:
    get:
      operationId: authMe
      summary: The authenticated user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /auth/sessions:
    get:
      operationId: authListSessions
      summary: The authenticated user's own active sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthSession"
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      summary: >
        Revokes one of the authenticated user's own sessions. A
        session id that exists but belongs to a different user is 404,
        not 403 (ADR-015: it must not even confirm that id is real).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/profile:
    put:
      operationId: updateProfile
      summary: Sets the authenticated user's display name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary: >
        Records onboarding_completed_at (ADR-015), but only once the
        authenticated user already has a display name and at least one
        watchlist item -- 400 otherwise, naming whichever is missing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /watchlist:
    get:
      operationId: getWatchlist
      summary: The authenticated user's own watchlist, in order (ADR-016 -- watchlists are private).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    put:
      operationId: updateWatchlist
      summary: >
        Replaces the authenticated user's whole watchlist at once, in
        the given order (ADR-015: enabled instruments, maximum 50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    SignupStartRequest:
      type: object
      required: [email, accepted_terms]
      properties:
        email:
          type: string
          format: email
        accepted_terms:
          type: boolean
    SignupVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
    SignupVerifyResponse:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
    SignupCompleteRequest:
      type: object
      required: [ticket, password]
      properties:
        ticket:
          type: string
        password:
          type: string
    ProfileUpdateRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
    WatchlistItem:
      type: object
      required: [instrument_id, position]
      properties:
        instrument_id:
          type: integer
          format: int64
        position:
          type: integer
          format: int32
    WatchlistUpdateRequest:
      type: object
      required: [instrument_ids]
      properties:
        instrument_ids:
          type: array
          description: Order in this array becomes each item's position.
          items:
            type: integer
            format: int64
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    # GenericAccepted is deliberately the same shape (and the same
    # literal value) regardless of what actually happened server-side
    # -- register/verify/resend's own ADR-015 requirement that the
    # response never discloses whether an email exists or is already
    # verified.
    GenericAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
    AuthUser:
      type: object
      required: [id, email, email_verified, created_at, onboarding_completed]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
          nullable: true
        onboarding_completed:
          type: boolean
    AuthSession:
      type: object
      required: [id, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        user_agent:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        current:
          type: boolean
    Instrument:
      type: object
      required:
        - id
        - provider
        - native_symbol
        - asset_class
        - price_scale
        - qty_scale
        - tick_size
        - supported_intervals
        - enabled
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        native_symbol:
          type: string
        asset_class:
          type: string
        base_asset:
          type: string
          nullable: true
        quote_asset:
          type: string
          nullable: true
        price_scale:
          type: integer
          format: int32
        qty_scale:
          type: integer
          format: int32
        # Decimal string, not a JSON number: tick_size is a quant.Price
        # scaled by price_scale, and a float would silently lose exactness
        # (guide 13) -- the same reason Candle's own OHLCV fields below are
        # strings, not numbers.
        tick_size:
          type: string
        supported_intervals:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    Candle:
      type: object
      required: [open_time, close_time, open, high, low, close, volume, is_closed, revision]
      properties:
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        # Decimal strings, built from the instrument's own price_scale
        # (open/high/low/close) and qty_scale (volume) -- never JSON
        # numbers, which cannot carry a quant.Price/quant.Qty's exact
        # scaled value without risking silent precision loss (guide 13).
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: string
        is_closed:
          type: boolean
        revision:
          type: integer
          format: int32
    # PlanSnapshot (internal/setups/types.go) is stored as JSONB but its
    # Go shape is stable (TargetSnapshot/POISnapshot/PlanSnapshot structs,
    # not a map), so it is typed here rather than left as a free-form
    # object -- the web-wiring-followup brief's own choice, made after
    # reading types.go. entry/stop/targets[].level/poi.low/poi.high are
    # decimal strings built from the setup's own instrument price_scale
    # (quant.Price.String(scale), internal/httpapi/setups.go's own
    # toAPIPlanSnapshot), matching every other money field this API sends
    # -- a breaking change from the bare scaled integers these fields sent
    # before (web-wiring-followup brief, Part 3); rr stays an exact
    # rational string (big.Rat.RatString()), unchanged.
    TargetSnapshot:
      type: object
      required: [level, rr]
      properties:
        level:
          type: string
        rr:
          type: string
    POISnapshot:
      type: object
      required:
        - type
        - direction
        - low
        - high
        - order_block_candle_id
        - order_block_candle_revision
        - order_block_open_time
        - qmr_fail_candle_id
        - qmr_fail_candle_revision
        - structural_swing_id
        - in_discount
      properties:
        type:
          type: string
        direction:
          type: string
        low:
          type: string
        high:
          type: string
        order_block_candle_id:
          type: integer
          format: int64
        order_block_candle_revision:
          type: integer
          format: int32
        order_block_open_time:
          type: string
          format: date-time
        qmr_fail_candle_id:
          type: integer
          format: int64
        qmr_fail_candle_revision:
          type: integer
          format: int32
        structural_swing_id:
          type: integer
          format: int64
        in_discount:
          type: boolean
    PlanSnapshot:
      type: object
      required: [status, direction, entry, stop, targets, poi, protected_swing_id]
      properties:
        status:
          type: string
        direction:
          type: string
        entry:
          type: string
        stop:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetSnapshot"
        poi:
          $ref: "#/components/schemas/POISnapshot"
        protected_swing_id:
          type: integer
          format: int64
    Setup:
      type: object
      required:
        - id
        - instrument_id
        - timeframe
        - poi_type
        - poi_source_candle_id
        - direction
        - strategy_version
        - state
        - poi_source_candle_revision
        - plan_snapshot
        - evaluation_time
        - algorithm_version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        instrument_id:
          type: integer
          format: int64
        timeframe:
          type: string
        poi_type:
          type: string
        poi_source_candle_id:
          type: integer
          format: int64
        direction:
          type: string
        strategy_version:
          type: string
        state:
          type: string
          enum: [detected, actionable, triggered, invalidated]
        poi_source_candle_revision:
          type: integer
          format: int32
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        last_event_id:
          type: integer
          format: int64
          nullable: true
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SetupEvent:
      type: object
      required:
        - id
        - setup_id
        - event_type
        - plan_snapshot
        - poi_source_candle_id
        - poi_source_candle_revision
        - evaluation_time
        - algorithm_version
        - created_at
      properties:
        id:
          type: integer
          format: int64
        setup_id:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [detected, actionable, triggered, invalidated, amendment]
        plan_snapshot:
          $ref: "#/components/schemas/PlanSnapshot"
        poi_source_candle_id:
          type: integer
          format: int64
        poi_source_candle_revision:
          type: integer
          format: int32
        evaluation_time:
          type: string
          format: date-time
        algorithm_version:
          type: string
        created_at:
          type: string
          format: date-time
