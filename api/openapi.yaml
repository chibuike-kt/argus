openapi: 3.1.0
info:
  title: ARGUS API
  version: 0.1.0
  description: >
    REST API for ARGUS. Commands, account operations, historical queries and
    resource management are REST under /api/v1 (ADR-004). Live updates are
    delivered over WebSockets and are specified separately.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: Connectivity check for the versioned API surface.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
